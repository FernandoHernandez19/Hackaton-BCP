<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pukllay · Juega. Cuida. Deja mejor.</title>
<meta name="theme-color" content="#14181f">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/images/icon-192.png">
<link rel="apple-touch-icon" href="/images/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pukllay">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--ink:#14181f;--ink2:#3a4350;--muted:#667080;--bg:#faf6ee;--card:#fff;--line:#e8e2d4;
--y:#ffc400;--y2:#f5b700;--ysoft:#fff0b8;--t:#17b8c9;--tsoft:#d6f3f7;--g:#1e9e4a;--gsoft:#ddf3e3;--r:#d0342c;--rsoft:#fde5e3;--amber:#8a5a00;
--shadow:0 6px 20px rgba(20,24,31,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
html,body{overflow-x:hidden}
.tile .v,.rules div,.act h3,.sp h2{overflow-wrap:anywhere}
body{margin:0;font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-weight:600;padding-bottom:96px;overscroll-behavior-y:contain}
a{color:inherit}
svg.i{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:20px;height:20px}
/* cabecera */
.top{position:sticky;top:0;z-index:50;background:var(--ink);color:#fff;overflow:hidden}
.top .in{max-width:760px;margin:0 auto;padding:14px 18px 12px;display:flex;align-items:center;justify-content:space-between;position:relative}
.top:after{content:"";position:absolute;right:-30px;top:-40px;width:130px;height:110px;background:var(--y);border-radius:0 0 0 100%;opacity:.95}
.brand{font-size:34px;font-weight:900;color:var(--y);line-height:1;text-decoration:none;letter-spacing:-.5px}
.brand-logo{display:block;width:230px;max-width:56vw;height:auto}
.top .brand{display:inline-block;background:var(--bg);border-radius:16px;padding:6px 14px 6px 10px;position:relative;z-index:2}
.tag{font-size:13px;font-weight:700;color:#fff;margin-top:2px}
.top .acts{display:flex;gap:18px;position:relative;z-index:2;color:#fff}
.top .acts a{position:relative;display:flex;min-width:44px;min-height:44px;align-items:center;justify-content:center;color:#fff;text-decoration:none}
.dot{position:absolute;top:8px;right:8px;width:11px;height:11px;border-radius:50%;background:var(--y);border:2px solid var(--ink)}
main{max-width:760px;margin:0 auto;padding:18px 18px 8px}
h1{font-size:30px;line-height:1.1;font-weight:900;margin:6px 0 6px;letter-spacing:-.5px}
h2{font-size:21px;font-weight:900;margin:22px 0 10px}
.sub{color:var(--ink2);font-size:16px;margin:0 0 14px;font-weight:600}
.muted{color:var(--muted);font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
/* botones */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;background:var(--y);color:var(--ink);border:0;border-radius:16px;font:800 19px Nunito,sans-serif;cursor:pointer;text-decoration:none;box-shadow:0 3px 0 rgba(160,110,0,.25);transition:transform .12s,background .15s}
.btn:hover{background:var(--y2)}.btn:active{transform:translateY(1px)}
.btn.out{background:#fff;border:2px solid #cfd3da;box-shadow:none;color:var(--ink)}
.btn.sm{min-height:44px;width:auto;padding:0 20px;font-size:17px;border-radius:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--t);outline-offset:2px}
/* chips, selects, buscador */
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--tsoft);color:#0b5d68;font-weight:800;border-radius:999px;padding:9px 14px;font-size:16px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:800;background:var(--gsoft);color:#126b2f}
.chip.y{background:var(--ysoft);color:var(--amber)}.chip.t{background:var(--tsoft);color:#0b5d68}.chip.r{background:var(--rsoft);color:var(--r)}.chip.gr{background:#eceef1;color:var(--muted)}
.search{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:0 16px;min-height:58px;margin-bottom:12px}
.search input{border:0;outline:0;flex:1;font:600 18px Nunito,sans-serif;background:transparent;min-height:54px;color:var(--ink)}
.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.sel{position:relative;background:#fff;border:2px solid var(--line);border-radius:16px;min-height:52px;display:flex;align-items:center;padding:0 10px;gap:6px}
.sel select{appearance:none;border:0;background:transparent;font:800 16px Nunito,sans-serif;width:100%;min-height:48px;outline:0;color:var(--ink);padding-right:18px;text-overflow:ellipsis}
.sel .chev{position:absolute;right:8px;pointer-events:none;width:18px;height:18px}
.field{background:#fff;border:2px solid var(--line);border-radius:16px;margin-bottom:12px;display:flex;align-items:stretch;overflow:hidden}
.field .ic{background:var(--tsoft);width:60px;display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.field .bd{flex:1;padding:6px 14px;position:relative;min-width:0}
.field label{font-size:13px;color:var(--muted);display:block;font-weight:700}
.field select,.field input{border:0;outline:0;width:100%;font:800 19px Nunito,sans-serif;background:transparent;appearance:none;padding:2px 24px 4px 0;color:var(--ink);min-height:30px}
textarea{width:100%;border:2px solid var(--line);border-radius:16px;padding:12px;font:600 17px Nunito,sans-serif;resize:none;color:var(--ink)}
/* segmentado */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:4px;margin-bottom:14px}
.seg a{display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;border-radius:14px;text-decoration:none;font-weight:800;font-size:16px;color:var(--ink2)}
.seg a.on{background:var(--y);color:var(--ink);box-shadow:0 2px 0 rgba(160,110,0,.25)}
/* mapa */
#map{height:300px;border-radius:22px;margin-bottom:14px;border:2px solid var(--line);z-index:1}
.pin{display:flex;align-items:center;gap:6px;transform:translate(-18px,-44px);white-space:nowrap}
.pin .b{width:38px;height:38px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.25);border:3px solid #fff}
.pin .b svg{transform:rotate(45deg);width:20px;height:20px;stroke:#fff}
.pin .l{background:#fff;border-radius:12px;padding:5px 10px;font:800 14px Nunito,sans-serif;box-shadow:0 3px 10px rgba(0,0,0,.18);color:var(--ink)}
.pin.on .l{background:var(--ysoft);outline:2px solid var(--y)}
/* tarjetas de espacio y actividad */
.sp{display:flex;gap:14px;margin-bottom:14px}
.thumb{width:116px;height:116px;border-radius:16px;object-fit:cover;flex:none;background:var(--tsoft);overflow:hidden;display:block}
.thumb svg{width:100%;height:100%;display:block}
.hero{width:100%;height:210px;border-radius:22px;object-fit:cover;display:block;overflow:hidden;position:relative;background:var(--tsoft)}
.hero svg{width:100%;height:100%;display:block}
.badge-demo{position:absolute;left:12px;top:12px;background:var(--ysoft);border-radius:999px;padding:7px 14px;font-weight:800;font-size:15px;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}
.tile{background:#fff;border-radius:18px;padding:12px;box-shadow:var(--shadow);text-align:left}
.tile .h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;line-height:1.15;margin-bottom:8px}
.tile .v{border-radius:12px;padding:8px 6px;text-align:center;font-weight:800;font-size:15px;line-height:1.2}
.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:12px}
.rules div{text-align:center;padding:0 6px;font-weight:800;font-size:16px;line-height:1.2}
.rules div+div{border-left:2px solid var(--line)}
.rules svg{width:46px;height:46px;stroke:var(--t);margin-bottom:6px}
.rules div:nth-child(3) svg{stroke:var(--g)}.rules div:nth-child(2) svg{stroke:var(--ink)}
.bar{height:9px;border-radius:99px;background:#dfe3e8;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--g);border-radius:99px}
.act{display:flex;gap:14px;margin-bottom:14px}
.act .tx{flex:1;min-width:0}
.act h3{margin:6px 0 4px;font-size:24px;line-height:1.1;font-weight:900}
.act .ln{display:flex;align-items:center;gap:8px;font-size:16px;color:var(--ink2);margin:3px 0}
.live{display:flex;align-items:center;gap:14px;background:var(--ysoft);border-radius:20px;padding:14px 16px;margin-bottom:14px;text-decoration:none}
.live b{font-size:30px;font-weight:900;line-height:1}
.pulse{width:12px;height:12px;border-radius:50%;background:var(--g);box-shadow:0 0 0 0 rgba(30,158,74,.5);animation:pu 1.8s infinite;flex:none}
@keyframes pu{70%{box-shadow:0 0 0 12px rgba(30,158,74,0)}100%{box-shadow:0 0 0 0 rgba(30,158,74,0)}}
.note{display:flex;gap:10px;align-items:flex-start;color:var(--ink2);font-style:italic;font-size:15px;margin:10px 4px}
.note svg{color:var(--t);margin-top:2px}
.info{display:flex;gap:12px;align-items:center;background:var(--tsoft);border-radius:16px;padding:14px;font-weight:800;font-size:17px;margin:12px 0}
.info svg{color:#0b8795;width:30px;height:30px}
/* franjas */
.slot{display:flex;align-items:center;gap:12px;border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px;margin-bottom:8px;font-weight:800;font-size:19px;cursor:pointer;min-height:56px}
.slot.on{border-color:var(--y);background:#fff8dc}
.slot.off{background:#eef0f3;color:var(--muted);cursor:not-allowed}
.slot input{width:24px;height:24px;accent-color:var(--ink)}
.slot .st{margin-left:auto}
.check{display:flex;gap:14px;align-items:center;padding:14px;border:2px solid var(--line);border-radius:16px;margin:8px 0;font-size:18px;cursor:pointer;background:#fff;font-weight:800;min-height:60px}
.check input{width:28px;height:28px;accent-color:var(--y);flex:none}
.check.on{border-color:var(--y);background:#fff8dc}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.steps span{text-align:center;padding:9px 2px;border-radius:12px;background:#e9e6dd;font-size:14px;font-weight:800;color:var(--muted)}
.steps span.on{background:var(--y);color:var(--ink)}.steps span.done{background:var(--gsoft);color:#126b2f}
.kpi{font-size:44px;font-weight:900;line-height:1}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.photos{display:flex;gap:10px;flex-wrap:wrap}.photos img{width:46%;max-width:240px;border-radius:14px}
.back{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.back a{width:52px;height:52px;border:2px solid var(--line);border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.back h1{margin:0;font-size:28px}
.av{display:inline-flex;width:34px;height:34px;border-radius:50%;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:15px;border:2px solid #fff;margin-right:-8px}
.feed .it{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.feed .it:last-child{border:0}
/* barra inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;border-radius:26px 26px 0 0;box-shadow:0 -6px 24px rgba(20,24,31,.1);padding:8px 10px calc(10px + env(safe-area-inset-bottom))}
.nav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.nav a{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;font-weight:800;font-size:14px;padding:8px 4px;border-radius:18px;min-height:60px;color:var(--ink2);justify-content:center}
.nav a.on{background:var(--ysoft);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:112px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:13px 20px;border-radius:14px;z-index:999;max-width:90vw;font-weight:800;text-align:center}
.toast.err{background:var(--r)}
.okring{width:92px;height:92px;border-radius:50%;background:var(--g);display:inline-flex;align-items:center;justify-content:center;margin-top:6px;box-shadow:0 0 0 10px rgba(30,158,74,.12)}
.banner-g{background:var(--gsoft);color:#0f5a27;border-radius:999px;padding:12px 16px;font-weight:800;font-size:19px;margin-bottom:14px}
.scan{position:relative;height:330px;border-radius:26px;overflow:hidden;border:6px solid #fff;box-shadow:var(--shadow);margin-bottom:14px;background:#7cc66a}
.scanbg,.scanimg{position:absolute;inset:0;width:100%;height:100%}.scanimg{height:100%!important}
.corner{position:absolute;width:56px;height:56px;border:6px solid #fff}
.corner.tl{left:36px;top:36px;border-right:0;border-bottom:0;border-radius:22px 0 0 0}.corner.tr{right:36px;top:36px;border-left:0;border-bottom:0;border-radius:0 22px 0 0}
.corner.bl{left:36px;bottom:60px;border-right:0;border-top:0;border-radius:0 0 0 22px}.corner.br{right:36px;bottom:60px;border-left:0;border-top:0;border-radius:0 0 22px 0}
.qrbox{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);background:#fff;border-radius:24px;padding:14px;line-height:0;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.qrbox img,.qrbox canvas{width:150px!important;height:150px!important}
.simpill{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(255,255,255,.88);border-radius:999px;padding:8px 16px;font-weight:800;font-size:16px;display:flex;gap:8px;align-items:center;white-space:nowrap}
.strip{display:flex;align-items:center;gap:14px;border-radius:18px;padding:14px 16px;margin-bottom:12px;font-size:19px;line-height:1.25}
.strip.g{background:var(--gsoft);color:#0f5a27}.strip.t{background:var(--tsoft);color:#0a4d57}
.strip .ck{width:46px;height:46px;border-radius:50%;background:var(--g);display:flex;align-items:center;justify-content:center;flex:none}.strip .ck svg{stroke:#fff;stroke-width:2.6}
.strip .ck.b{background:transparent;border:2px solid var(--t);border-radius:12px}.strip .ck.b svg{stroke:var(--t);stroke-width:1.9}


/* ---------- novedades de experiencia ---------- */
main>*{animation:rise .38s cubic-bezier(.2,.7,.3,1) both}
main>*:nth-child(2){animation-delay:.05s}main>*:nth-child(3){animation-delay:.1s}main>*:nth-child(4){animation-delay:.15s}main>*:nth-child(n+5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.btn.wa{background:#25d366;box-shadow:0 3px 0 rgba(10,100,50,.3);color:#06260f}.btn.wa:hover{background:#1fbf5b}
.sharecard{background:linear-gradient(135deg,#eafbef,#fff)}
.ticker{overflow:hidden;border-radius:14px;background:var(--ink);color:#fff;margin-bottom:14px;padding:11px 0;white-space:nowrap;-webkit-mask:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.ticker .tk{display:inline-flex;gap:34px;padding-left:24px;animation:tick 38s linear infinite}
.ticker span{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.ticker svg{color:var(--y)}
@keyframes tick{to{transform:translateX(-50%)}}
.streak .flame{width:58px;height:58px;border-radius:18px;background:linear-gradient(160deg,#ffd75a,#ff9a1f);display:flex;align-items:center;justify-content:center;color:#7a2d00;flex:none;margin-right:12px;box-shadow:0 6px 14px rgba(255,150,30,.35)}
.streak .flame svg{width:32px;height:32px;fill:#fff3c9}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin:-4px 2px 10px;font-weight:700}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.pin{position:relative}
.pin .ping{position:absolute;left:0;top:0;width:38px;height:38px;border-radius:50%;box-shadow:0 0 0 0 rgba(30,158,74,.55);animation:pu 1.8s infinite;pointer-events:none}
.cmp{position:relative;aspect-ratio:4/3;border-radius:18px;overflow:hidden;margin-top:12px;background:#dfe3e8;touch-action:pan-y}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cmp .bf{clip-path:inset(0 calc(100% - var(--p)) 0 0)}
.cmp:after{content:"";position:absolute;top:0;bottom:0;left:var(--p);width:3px;margin-left:-1.5px;background:#fff;box-shadow:0 0 8px rgba(0,0,0,.45)}
.cmp:before{content:"";position:absolute;left:var(--p);top:50%;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.35);z-index:2}
.cmp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;z-index:3;margin:0}
.cmp .lb,.cmp .ra{position:absolute;top:12px;background:rgba(20,24,31,.75);color:#fff;font-weight:800;font-size:13px;padding:5px 11px;border-radius:999px;z-index:1}
.cmp .lb{left:12px}.cmp .ra{right:12px}
.cmp .ex{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:var(--ysoft);color:var(--ink);font-weight:800;font-size:13px;padding:5px 12px;border-radius:999px;z-index:1;pointer-events:none}
.celebrate,.onb{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(20,24,31,.72);backdrop-filter:blur(4px);animation:fade .25s ease both}
@keyframes fade{from{opacity:0}}
.cel-card,.onb-card{position:relative;background:#fff;border-radius:28px;padding:26px 22px 22px;max-width:420px;width:100%;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.35);animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(20px)}}
.cel-card h2,.onb-card h2{font-size:30px;margin:8px 0 6px;font-weight:900}
.cel-card p,.onb-card p{color:var(--ink2);font-size:17px;margin:0 0 18px;line-height:1.4}
.stamp{width:150px;height:150px;animation:stamp .7s cubic-bezier(.2,1.5,.4,1) .15s both}
@keyframes stamp{from{opacity:0;transform:scale(2.4) rotate(-25deg)}to{opacity:1;transform:none}}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.confetti i{position:absolute;top:-16px;width:10px;height:16px;border-radius:2px;animation:fall 2.6s ease-in both}
@keyframes fall{to{transform:translate(var(--x),105vh) rotate(620deg)}}
.onb-art svg{width:100%;max-width:300px;height:auto;margin:6px auto 4px;display:block}
.onb-skip{position:absolute;right:16px;top:14px;background:none;border:0;font:800 15px Nunito,sans-serif;color:var(--muted);cursor:pointer;min-height:44px;padding:0 8px}
.dots{display:flex;gap:8px;justify-content:center;margin:0 0 18px}.dots i{width:9px;height:9px;border-radius:50%;background:#dfe3e8;transition:all .2s}.dots i.on{width:26px;border-radius:9px;background:var(--y2)}


/* ---------- recorrido 3D del espacio ---------- */
.m3d-img{position:relative;border-radius:18px;overflow:hidden;background:#0b1d4a;margin-top:12px;aspect-ratio:1672/941}
.m3d-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.hot{position:absolute;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;border:3px solid #fff;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;animation:hotp 2.2s infinite;transition:transform .15s,background .15s;z-index:2}
.hot svg{width:20px;height:20px}
.hot:hover{transform:translate(-50%,-50%) scale(1.12)}
.hot.on{background:var(--y);color:var(--ink);transform:translate(-50%,-50%) scale(1.18);animation:none;box-shadow:0 0 0 6px rgba(255,196,0,.4)}
@keyframes hotp{0%{box-shadow:0 0 0 0 rgba(255,196,0,.7)}70%{box-shadow:0 0 0 14px rgba(255,196,0,0)}100%{box-shadow:0 0 0 0 rgba(255,196,0,0)}}
.hot-info{margin-top:12px;background:var(--ysoft);border-radius:16px;padding:14px;min-height:96px}

<script>
const $app = document.getElementById("app");
let S = null;           // estado del servidor
let POLL = null;        // refresco automático en pantallas "en vivo"
const Q = { q: "", act: "", dist: "", hour: "" }; // filtros de Explorar
const TZ = "America/Lima", CENTER = [-11.9925, -77.0705];
const CATS = ["Fútbol", "Vóley", "Básquet", "Baile", "Gincana", "Juegos tradicionales", "Bienestar", "Otro"];
const TITLES = { "Fútbol": "Fútbol amistoso", "Vóley": "Vóley vecinal", "Básquet": "Básquet 3x3", "Baile": "Baile comunitario", "Gincana": "Gincana del barrio", "Juegos tradicionales": "Juegos tradicionales", "Bienestar": "Bienestar al aire libre", "Otro": "Actividad vecinal" };
const ICON = (c) => ({ "Fútbol": "ball", "Vóley": "volley", "Básquet": "ball", "Baile": "users", "Gincana": "play", "Juegos tradicionales": "play", "Bienestar": "heart" }[c] || "ball");
const COLORS = ["#e4572e", "#17b8c9", "#7c5cff", "#1e9e4a", "#f08a24", "#d63384", "#2f6fed", "#8a6d00"];

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ic = (n, cls = "") => `<svg class="i ${cls}"><use href="#i-${n}"/></svg>`;
const getName = () => { try { return localStorage.getItem("pk_name") || ""; } catch { return ""; } };
const setName = (n) => { try { localStorage.setItem("pk_name", n); } catch {} };
const getFavs = () => { try { return JSON.parse(localStorage.getItem("pk_favs") || "[]"); } catch { return []; } };
const setFavs = (f) => { try { localStorage.setItem("pk_favs", JSON.stringify(f)); } catch {} };
const pad = (n) => String(n).padStart(2, "0");
const space = (id) => S.spaces.find((s) => s.id === id);
const dkey = (d) => new Date(new Date(d).getTime() - 5 * 3600e3).toISOString().slice(0, 10);
const addDays = (key, n) => new Date(new Date(key + "T12:00:00-05:00").getTime() + n * 864e5).toISOString().slice(0, 10);
const todayKey = () => dkey(Date.now());
const hhmm = (iso) => new Date(iso).toLocaleTimeString("es-PE", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: TZ });
const dayLabel = (iso) => { const k = dkey(iso); if (k === todayKey()) return "Hoy"; if (k === addDays(todayKey(), 1)) return "Mañana"; return new Date(iso).toLocaleDateString("es-PE", { weekday: "short", day: "numeric", month: "short", timeZone: TZ }); };
const when = (iso) => `${dayLabel(iso)} · ${hhmm(iso)}`;
const limaHour = () => new Date(Date.now() - 5 * 3600e3).getUTCHours();
const openNow = (sp) => !sp.hours || (limaHour() >= sp.hours.from && limaHour() < sp.hours.to);
const hoursTxt = (sp) => (sp.hours ? `${pad(sp.hours.from)}:00 – ${pad(sp.hours.to)}:00` : sp.schedule);
const km = (sp) => { const R = 6371, r = Math.PI / 180, dLa = (sp.lat - CENTER[0]) * r, dLo = (sp.lng - CENTER[1]) * r; const a = Math.sin(dLa / 2) ** 2 + Math.cos(CENTER[0] * r) * Math.cos(sp.lat * r) * Math.sin(dLo / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(a)); };
const distTxt = (sp) => { const d = km(sp); return d < 1 ? `a ${Math.round(d * 10) * 100} m` : `a ${d.toFixed(1)} km`; };
const color = (n) => COLORS[[...String(n)].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];
const avatar = (n) => `<span class="av" style="background:${color(n)}" title="${esc(n)}">${esc(String(n)[0] || "?").toUpperCase()}</span>`;
const ago = (iso) => { const m = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000)); if (m < 1) return "ahora"; if (m < 60) return `hace ${m} min`; const h = Math.round(m / 60); return h < 24 ? `hace ${h} h` : `hace ${Math.round(h / 24)} d`; };

async function api(path, body) {
  const r = await fetch("/api/" + path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json(); if (!r.ok) throw new Error(j.error || "Error"); return j;
}
async function refresh() { S = await api("state"); }
function toast(msg, err) { const t = document.createElement("div"); t.className = "toast" + (err ? " err" : ""); t.setAttribute("role", "status"); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3200); }
async function act(fn) { try { await fn(); } catch (e) { toast(e.message, true); } }
function readPhoto(file) {
  return new Promise((resolve) => {
    if (!file) return resolve(undefined);
    const img = new Image(), fr = new FileReader();
    fr.onload = () => { img.onload = () => { const k = Math.min(1, 640 / Math.max(img.width, img.height)), c = document.createElement("canvas"); c.width = img.width * k; c.height = img.height * k; c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); resolve(c.toDataURL("image/jpeg", 0.6)); }; img.onerror = () => resolve(undefined); img.src = fr.result; };
    fr.onerror = () => resolve(undefined); fr.readAsDataURL(file);
  });
}

// ---------- ilustraciones (si no hay foto en /img se dibuja una escena) ----------
function scene(kind) {
  const court = kind === "losa";
  return `<svg viewBox="0 0 320 220" preserveAspectRatio="xMidYMid slice"><rect width="320" height="220" fill="#bfe7f5"/><circle cx="262" cy="46" r="26" fill="#fff6c7"/><ellipse cx="80" cy="50" rx="34" ry="11" fill="#fff"/><ellipse cx="110" cy="44" rx="26" ry="10" fill="#fff"/>
  <rect y="132" width="320" height="88" fill="${court ? "#4aa7c9" : "#7cc66a"}"/>${court ? '<g stroke="#fff" stroke-width="3" fill="none"><rect x="30" y="148" width="260" height="58" rx="4"/><path d="M160 148v58"/><circle cx="160" cy="177" r="14"/></g><rect x="148" y="100" width="4" height="48" fill="#444"/><path d="M104 118h112" stroke="#fff" stroke-width="3"/>' : '<circle cx="70" cy="92" r="46" fill="#4f9e45"/><circle cx="108" cy="104" r="32" fill="#5fb353"/><rect x="64" y="110" width="12" height="52" fill="#8a5a36"/><rect x="214" y="150" width="70" height="10" rx="3" fill="#c88a4e"/><rect x="220" y="140" width="58" height="8" rx="3" fill="#d9a066"/><rect x="262" y="96" width="5" height="60" fill="#333"/><circle cx="264" cy="92" r="9" fill="#ffd54a"/>'}</svg>`;
}
function tileCat(cat) { return `<svg viewBox="0 0 120 120"><rect width="120" height="120" fill="${cat === "Vóley" ? "#4aa7c9" : cat === "Baile" || cat === "Bienestar" ? "#ffe7a3" : "#7cc66a"}"/><circle cx="60" cy="60" r="30" fill="#fff"/><g transform="translate(40 40) scale(1.7)" stroke="#14181f" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><use href="#i-${ICON(cat)}"/></g></svg>`; }
const imgOr = (base, fb, cls) => `<span class="${cls}" style="display:block;position:relative">${fb}<img src="${base}.jpg" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0" onerror="if(!this.dataset.t){this.dataset.t=1;this.src='${base}.png'}else{this.remove()}"></span>`;
const spaceImg = (sp, cls) => imgOr(`/images/app/${sp.id}`, scene(sp.type), cls);
const catImg = (cat, cls) => imgOr(`/images/app/cat-${cat.normalize("NFD").replace(/[^a-z]/gi, "").toLowerCase()}`, tileCat(cat), cls);

// ---------- navegación ----------
function nav(active) {
  const t = [["", "map", "Explorar"], ["actividades", "cal", "Actividades"], ["mis-espacios", "book", "Mis espacios"], ["perfil", "user", "Perfil"]];
  const html = t.map(([h, i, l]) => `<a href="#/${h}" class="${active === h ? "on" : ""}">${ic(i)}<span>${l}</span></a>`).join("");
  document.getElementById("nav").innerHTML = html; document.getElementById("dnav").innerHTML = html;
}
function back(title, href) { return `<div class="back"><a href="${href}" aria-label="Volver">${ic("back")}</a><h1>${esc(title)}</h1></div>`; }
const note = (t) => `<div class="note">${ic("info", "s")}<span>${t}</span></div>`;

// ---------- Explorar ----------
function filteredSpaces() {
  let list = S.spaces.slice();
  if (Q.q) list = list.filter((s) => (s.name + " " + (s.sports || "")).toLowerCase().includes(Q.q.toLowerCase()));
  if (Q.act) list = list.filter((s) => S.activities.some((a) => a.spaceId === s.id && a.category === Q.act && a.status !== "completada") || (s.sports || "").toLowerCase().includes(Q.act.toLowerCase().slice(0, 4)));
  if (Q.hour === "ahora") list = list.filter(openNow);
  if (Q.dist) list = list.filter((s) => km(s) <= Number(Q.dist));
  return list.sort((a, b) => km(a) - km(b));
}
function viewHome() {
  nav("");
  const st = S.stats;
  $app.innerHTML = `<div class="explore"><div class="ex-head"><h1>Espacios cerca de ti</h1><p class="sub">Descubre parques y losas, revisa sus horarios y únete a actividades.</p>
  <a class="live" href="#/en-vivo"><span class="pulse"></span><div><b>${st.playingNow}</b> <span style="font-weight:800">vecinos jugando ahora</span><div class="muted">${st.liveActivities} actividades en curso · ${st.neighbors} vecinos activos (datos simulados)</div></div><span style="margin-left:auto">${ic("right")}</span></a>
  ${ticker()}
  <label class="search">${ic("search")}<input id="q" type="search" placeholder="Busca un parque o losa" value="${esc(Q.q)}" aria-label="Buscar espacio"></label>
  <div class="filters">
    <div class="sel">${ic("ball", "s")}<select id="fa" aria-label="Actividad"><option value="">Actividad</option>${CATS.slice(0, 6).map((c) => `<option ${Q.act === c ? "selected" : ""}>${c}</option>`).join("")}</select>${ic("chev", "chev")}</div>
    <div class="sel">${ic("pin", "s")}<select id="fd" aria-label="Distancia"><option value="">Distancia</option><option value="0.7" ${Q.dist === "0.7" ? "selected" : ""}>Menos de 700 m</option><option value="1.5" ${Q.dist === "1.5" ? "selected" : ""}>Menos de 1,5 km</option></select>${ic("chev", "chev")}</div>
    <div class="sel">${ic("cal", "s")}<select id="fh" aria-label="Horario"><option value="">Horario</option><option value="ahora" ${Q.hour === "ahora" ? "selected" : ""}>Abierto ahora</option></select>${ic("chev", "chev")}</div>
  </div>
  </div><div id="map" role="application" aria-label="Mapa de espacios"></div><div id="sel"></div></div>
  <div class="legend"><span><i style="background:#1e9e4a"></i>Racha 10+</span><span><i style="background:#17b8c9"></i>Racha 5–9</span><span><i style="background:#f5b700"></i>Racha nueva</span><span><i style="background:#1e9e4a;box-shadow:0 0 0 3px rgba(30,158,74,.3)"></i>Jugando ahora</span></div>
  ${note("Horarios y disponibilidad sujetos a confirmación municipal. Todos los datos de esta demo son simulados.")}`;
  const rerender = () => { Q.q = document.getElementById("q").value; Q.act = document.getElementById("fa").value; Q.dist = document.getElementById("fd").value; Q.hour = document.getElementById("fh").value; drawMap(); };
  document.getElementById("q").oninput = rerender; ["fa", "fd", "fh"].forEach((id) => (document.getElementById(id).onchange = rerender));
  drawMap();
}
let MAP = null;
function drawMap(selId) {
  const list = filteredSpaces(); const el = document.getElementById("map"); if (!el) return;
  const pick = list.find((s) => s.id === selId) || list[0];
  const sel = document.getElementById("sel");
  const wide = matchMedia("(min-width:1024px)").matches; // en escritorio se listan todos los espacios
  sel.innerHTML = !pick ? `<div class="card"><strong>No hay espacios con esos filtros.</strong></div>` : wide ? list.map((x) => spaceCard(x, x.id === pick.id)).join("") : spaceCard(pick);
  if (!window.L) { el.outerHTML = '<div class="card muted">El mapa necesita internet. Usa la lista de espacios de abajo.</div>'; return; }
  if (MAP) { MAP.remove(); MAP = null; }
  MAP = L.map(el, { zoomControl: true, attributionControl: true }).setView(CENTER, 15);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "© OpenStreetMap" }).addTo(MAP);
  const pts = [];
  list.forEach((s) => {
    const c = s.careStreak >= 10 ? "#1e9e4a" : s.careStreak >= 5 ? "#17b8c9" : "#f5b700", on = pick && s.id === pick.id, live = S.activities.some((a) => a.spaceId === s.id && a.status === "en_curso");
    const m = L.marker([s.lat, s.lng], { icon: L.divIcon({ className: "", html: `<div class="pin ${on ? "on" : ""}">${live ? '<span class="ping"></span>' : ""}<div class="b" style="background:${c}">${ic(s.type === "losa" ? "ball" : "play")}</div><div class="l">${esc(s.name)}</div></div>`, iconSize: [0, 0] }) }).addTo(MAP);
    m.on("click", () => drawMap(s.id)); pts.push([s.lat, s.lng]);
  });
  if (pts.length > 1) MAP.fitBounds(pts, { padding: [50, 50], maxZoom: 16 });
  setTimeout(() => MAP && MAP.invalidateSize(), 50);
}
function spaceCard(s, on) {

function needName() { let n = myName(); if (!n) { n = (prompt("¿Cómo te llamas? (solo se muestra tu nombre)") || "").trim(); if (n) setName(n); } return n; }

// ---------- Crear actividad ----------
function slotsFor(sp, dateKey) {
  const out = []; if (!sp.hours) return out;
  for (let h = sp.hours.from; h < sp.hours.to; h++) {
    const iso = new Date(`${dateKey}T${pad(h)}:00:00-05:00`).toISOString(), t = new Date(iso);
    const taken = S.activities.some((a) => a.spaceId === sp.id && a.status !== "completada" && Math.abs(new Date(a.startsAt) - t) < 3600e3);
    out.push({ h, iso, ok: !taken && t > Date.now() });
  }
  return out;
}

  <div class="card"><div class="muted">Vecinos activos</div><div class="kpi">${st.neighbors}</div></div><div class="card"><div class="muted">Propuestas abiertas</div><div class="kpi">${st.proposalsOpen}</div></div></div>
  <div class="card feed"><h2 style="margin:0 0 4px">Lo que pasa en el barrio</h2>${S.feed.map((f) => `<div class="it"><span class="chip t" style="padding:8px">${ic(EV[f.type] || "info", "s")}</span><div><div>${esc(f.text)}</div><div class="muted">${ago(f.at)}</div></div></div>`).join("")}</div>
  <div class="card"><h2 style="margin:0 0 8px">Jugando ahora</h2>${S.activities.filter((a) => a.status === "en_curso").map((a) => `<a href="#/actividad/${a.id}" style="text-decoration:none;display:block;margin-bottom:12px"><strong>${esc(a.title)}</strong> <span class="muted">· ${esc(space(a.spaceId)?.name)}</span><div style="margin-top:6px">${a.participants.slice(0, 8).map(avatar).join("")}<span class="muted" style="margin-left:18px">${a.participants.length} personas</span></div></a>`).join("") || '<p class="muted">Nadie jugando por ahora.</p>'}</div>
  ${note("Actividad simulada para la demostración. Se actualiza sola cada pocos segundos con lo que hagan los usuarios de esta demo.")}`;
}

// ---------- Panel municipal ----------
function viewMuni() {
  nav("perfil"); const i = S.indicator;
  $app.innerHTML = `${back("Panel municipal", "#/perfil")}<p class="sub" style="margin-top:-6px">Uso responsable de los espacios. Datos simulados.</p>
  <div class="grid2"><div class="card"><div class="muted">Actividades cerradas con el espacio en buen estado</div><div class="kpi" style="color:var(--g)">${i.pct === null ? "—" : i.pct + "%"}</div><div class="muted">${i.clean} de ${i.completed} completadas</div></div>
  <div class="card"><div class="muted">Llegadas con check-in</div><div class="kpi">${i.arrivals}</div></div><div class="card"><div class="muted">Incidencias abiertas</div><div class="kpi" style="color:var(--r)">${i.incidentsOpen}</div><div class="muted">${i.incidentsResolved} resueltas</div></div>
  <div class="card"><div class="muted">Propuestas con apoyo del barrio</div><div class="kpi">${S.proposals.filter((p) => p.votes.length >= S.stats.approvalVotes).length}</div><div class="muted">de ${S.proposals.length} propuestas</div></div></div>
  <h2>Racha de cuidado por espacio</h2>${S.spaces.map((s) => `<div class="card between"><strong>${esc(s.name)}</strong><span class="chip">${s.careStreak} usos seguidos en buen estado</span></div>`).join("")}
  <h2>Incidencias</h2>${S.incidents.map((n) => `<div class="card"><div class="row"><span class="chip ${n.status === "abierta" ? "y" : ""}">${n.status}</span><strong>${esc(n.category)}</strong><span class="muted">${esc(space(n.spaceId)?.name)} · ${ago(n.createdAt)}</span></div><p>${esc(n.description)}</p>${n.status === "abierta" ? `<button class="btn sm" data-res="${n.id}">Marcar como resuelta</button>` : ""}</div>`).join("") || '<p class="muted">Sin incidencias.</p>'}
  <h2>Demo</h2><button class="btn out sm" id="reset">Reiniciar datos de la demo</button>`;
  document.querySelectorAll("[data-res]").forEach((b) => (b.onclick = () => act(async () => { await api(`incidents/${b.dataset.res}/resolve`, {}); await refresh(); viewMuni(); })));
  document.getElementById("reset").onclick = () => act(async () => { if (!confirm("¿Reiniciar los datos de la demo?")) return; await api("reset", {}); await refresh(); viewMuni(); toast("Demo reiniciada"); });
}
function notFound() { nav(""); $app.innerHTML = '<h1>No encontrado</h1><a class="btn" href="#/">Volver al inicio</a>'; }

// ---------- enrutador ----------
async function router(silent) {
  try { await refresh(); } catch { $app.innerHTML = "<p>No se pudo conectar con el servidor.</p>"; return; }
  const [, p, id] = location.hash.split("/");
  $app.dataset.view = p || "home";
  if (!silent) window.scrollTo(0, 0);
  ({ espacio: viewSpace, actividades: viewActs, crear: viewCreate, proponer: viewPropose, actividad: viewActivity, qr: viewQr, cierre: viewClose, "mis-espacios": viewMine, perfil: viewProfile, "en-vivo": viewLive, muni: viewMuni }[p] || viewHome)(id);
}
addEventListener("hashchange", () => router(false));
matchMedia("(min-width:1024px)").addEventListener("change", () => { if (!location.hash.split("/")[1]) drawMap(); });
setInterval(async () => { // refresco suave solo en pantallas "en vivo"
  const p = location.hash.split("/")[1]; if (p !== "en-vivo" || document.hidden) return;
  try { await refresh(); viewLive(); } catch {}
}, 6000);
router(false).then(maybeOnboard);
</script>
</body>
</html>
